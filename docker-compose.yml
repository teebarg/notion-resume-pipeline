services:

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    ports:
      - "6002:3000"
    networks:
      - dev-net
    volumes:
      - ./apps/web:/app
      - /app/node_modules             # anonymous volume so container's node_modules win
    environment:
      - NODE_ENV=development
    env_file:
      - ./apps/web/.env
    # depends_on:
    #   api:
    #     condition: service_healthy    # wait for api to be ready

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/api.dev.Dockerfile
    platform: linux/amd64 # Patch for M1 Mac
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "6001:8000"
    env_file:
      - ./apps/api/.env
    networks:
      - dev-net
    volumes:
      - ./apps/api/:/app
      - /app/.venv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dev-net:
    external: true