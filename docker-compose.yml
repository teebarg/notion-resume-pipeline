services:
  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    volumes:
      - ./apps/web:/app
      - /app/node_modules             # anonymous volume so container's node_modules win
    environment:
      - NODE_ENV=development
    env_file:
      - ./apps/web/.env
    networks:
      - dev-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.cv.rule=Host(`cv.localhost`)
      - traefik.http.services.cv.loadbalancer.server.port=3000

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/api.dev.Dockerfile
    platform: linux/amd64 # Patch for M1 Mac
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file:
      - ./apps/api/.env
    networks:
      - dev-net
    volumes:
      - ./apps/api/:/app
      - /app/.venv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.cv-api.rule=Host(`cv-api.localhost`)
      - traefik.http.routers.cv-api.entrypoints=web
      - traefik.http.services.cv-api.loadbalancer.server.port=8000

networks:
  dev-net:
    external: true